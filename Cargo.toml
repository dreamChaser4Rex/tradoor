[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"

[profile.release]
lto = true
codegen-units = 1

[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"

[workspace.dependencies]
tradoor-core = { path = "crates/core" }
tradoor-codec = { path = "crates/codec" }
tradoor-venues = { path = "crates/venues" }
tradoor-render = { path = "crates/render" }
tradoor-store = { path = "crates/store" }
